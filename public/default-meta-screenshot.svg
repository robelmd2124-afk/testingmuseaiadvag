<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 860" width="400" height="860">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Phone Background -->
  <rect width="400" height="860" fill="url(#bgGrad)"/>

  <!-- Top Status Bar -->
  <text x="28" y="24" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">12:56</text>
  <g transform="translate(320, 13)">
    <!-- Signal Bars -->
    <rect x="0" y="8" width="3" height="4" rx="1" fill="#0F172A"/>
    <rect x="5" y="6" width="3" height="6" rx="1" fill="#0F172A"/>
    <rect x="10" y="3" width="3" height="9" rx="1" fill="#0F172A"/>
    <rect x="15" y="0" width="3" height="12" rx="1" fill="#0F172A"/>
    <!-- Wifi -->
    <path d="M24,10 A6,6 0 0,1 32,10 M22,7 A9,9 0 0,1 34,7" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Battery 74% -->
    <rect x="38" y="1" width="18" height="10" rx="2.5" fill="none" stroke="#0F172A" stroke-width="1.5"/>
    <rect x="40" y="3" width="11" height="6" rx="1.5" fill="#0F172A"/>
    <rect x="56" y="4" width="2" height="4" rx="0.5" fill="#0F172A"/>
  </g>

  <!-- Navigation / Campaign Header Bar -->
  <g transform="translate(0, 42)">
    <!-- Back arrow -->
    <path d="M22,20 L16,26 L22,32" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Thumbnail Image -->
    <rect x="36" y="10" width="36" height="36" rx="8" fill="#FEE2E2"/>
    <rect x="42" y="16" width="11" height="24" rx="2" fill="#B91C1C"/>
    <rect x="55" y="16" width="11" height="24" rx="2" fill="#991B1B"/>
    <circle cx="61" cy="42" r="4" fill="#059669"/>

    <!-- Campaign Title & Status -->
    <text x="82" y="24" font-family="-apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">028/014 Grand Royal</text>
    <text x="82" y="40" font-family="-apple-system, Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#0F172A">Perfume 01-Oct-26 06-Oc...</text>
    <text x="82" y="56" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="600" fill="#059669">Active <tspan fill="#64748B">Engagement</tspan></text>

    <!-- Toggle Switch -->
    <rect x="296" y="24" width="34" height="20" rx="10" fill="#0284C7"/>
    <circle cx="320" cy="34" r="8" fill="#FFFFFF"/>

    <!-- Three dots -->
    <circle cx="356" cy="28" r="2" fill="#64748B"/>
    <circle cx="356" cy="34" r="2" fill="#64748B"/>
    <circle cx="356" cy="40" r="2" fill="#64748B"/>
  </g>

  <!-- Edit & Duplicate Buttons -->
  <g transform="translate(18, 120)">
    <rect x="0" y="0" width="176" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="88" y="24" text-anchor="middle" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#334155">✎ Edit</text>

    <rect x="188" y="0" width="176" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="276" y="24" text-anchor="middle" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="700" fill="#334155">⎘ Duplicate</text>
  </g>

  <!-- Results Header -->
  <g transform="translate(18, 178)">
    <text x="0" y="26" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="800" fill="#0F172A">Results</text>
    <rect x="190" y="8" width="120" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="250" y="26" text-anchor="middle" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="600" fill="#334155">Performance</text>
    <rect x="318" y="8" width="32" height="28" rx="6" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <circle cx="334" cy="18" r="1.5" fill="#64748B"/>
    <circle cx="334" cy="22" r="1.5" fill="#64748B"/>
    <circle cx="334" cy="26" r="1.5" fill="#64748B"/>
  </g>

  <!-- Filter Pills (30 days / Maximum / Today) -->
  <g transform="translate(18, 226)">
    <rect x="0" y="0" width="364" height="42" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2"/>
    <text x="56" y="26" text-anchor="middle" font-family="-apple-system, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#334155">📅 30 days</text>
    
    <!-- Maximum Active Pill -->
    <rect x="142" y="4" width="102" height="34" rx="6" fill="#E0F2FE"/>
    <text x="193" y="26" text-anchor="middle" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="800" fill="#0369A1">Maximum</text>

    <text x="304" y="26" text-anchor="middle" font-family="-apple-system, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Today</text>
  </g>

  <!-- Metric Card 1: Messaging conversations started (148) -->
  <g transform="translate(18, 280)">
    <rect x="0" y="0" width="176" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="12" y="18" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Messaging conversations</text>
    <text x="12" y="30" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">started</text>
    <path d="M162,20 L166,24 L162,28" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="12" y="60" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="900" fill="#0F172A">148</text>
    <!-- Wave Sparkline -->
    <path d="M100,54 Q114,38 128,52 T156,48 T170,54" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Metric Card 2: Reach (7,733) -->
  <g transform="translate(206, 280)">
    <rect x="0" y="0" width="176" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="12" y="22" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Reach</text>
    <text x="12" y="60" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="900" fill="#0F172A">7,733</text>
  </g>

  <!-- Metric Card 3: CPR ($0.0541) -->
  <g transform="translate(18, 380)">
    <rect x="0" y="0" width="176" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="12" y="18" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Cost per Messaging</text>
    <text x="12" y="30" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">conversation started</text>
    <path d="M162,20 L166,24 L162,28" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="12" y="60" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="900" fill="#0F172A">$0.0541</text>
    <!-- Wave Sparkline -->
    <path d="M102,56 Q122,54 142,48 T170,50" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Metric Card 4: Impressions (12,154) -->
  <g transform="translate(206, 380)">
    <rect x="0" y="0" width="176" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="12" y="22" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Impressions</text>
    <text x="12" y="60" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="900" fill="#0F172A">12,154</text>
  </g>

  <!-- Metric Card 5: Spent ($8.00) -->
  <g transform="translate(18, 480)">
    <rect x="0" y="0" width="176" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="12" y="22" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Spent • <tspan fill="#0284C7" font-weight="700">Budget: $8.50</tspan></text>
    <path d="M162,20 L166,24 L162,28" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
    <text x="12" y="60" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="900" fill="#0F172A">$8.00</text>
    <!-- Wave Sparkline -->
    <path d="M100,56 Q114,40 128,54 T156,48 T170,56" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Metric Card 6: Recommendation -->
  <g transform="translate(206, 480)">
    <rect x="0" y="0" width="176" height="88" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="12" y="22" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Recommendation g</text>
    <text x="12" y="60" font-family="-apple-system, Roboto, sans-serif" font-size="22" font-weight="900" fill="#94A3B8">--</text>
  </g>

  <!-- Ad Creative Insights Card -->
  <g transform="translate(18, 582)">
    <rect x="0" y="0" width="364" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <rect x="12" y="11" width="32" height="32" rx="6" fill="#FEE2E2"/>
    <rect x="17" y="16" width="10" height="22" rx="2" fill="#B91C1C"/>
    <rect x="29" y="16" width="10" height="22" rx="2" fill="#991B1B"/>
    <text x="54" y="26" font-family="-apple-system, Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">Ad creative insights</text>
    <text x="54" y="42" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Frequency for this ad</text>
    <rect x="298" y="16" width="32" height="22" rx="11" fill="#F1F5F9"/>
    <text x="314" y="32" text-anchor="middle" font-family="-apple-system, Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0F172A">1.6</text>
    <path d="M346,23 L350,27 L346,31" fill="none" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Updates Section at Bottom -->
  <g transform="translate(18, 650)">
    <text x="0" y="24" font-family="-apple-system, Roboto, sans-serif" font-size="18" font-weight="800" fill="#0F172A">Updates</text>
    <rect x="0" y="36" width="364" height="76" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="16" y="62" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="800" fill="#0F172A">See where your customers drop of...</text>
    <text x="16" y="80" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B">Last 30 days</text>
    <text x="16" y="98" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Messaging conversations started</text>
    <!-- Meta AI Sparkle Button -->
    <circle cx="332" cy="74" r="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="332" cy="74" r="8" fill="#A855F7" opacity="0.8"/>
  </g>
</svg>
