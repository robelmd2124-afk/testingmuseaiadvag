<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Radial Gradient (Charcoal slate with soft center spotlight) -->
    <radialGradient id="slateGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#404656" />
      <stop offset="55%" stop-color="#2D323E" />
      <stop offset="100%" stop-color="#1B1E26" />
    </radialGradient>

    <!-- Vibrant Red 3D Gradients -->
    <linearGradient id="redFront" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="40%" stop-color="#ED1C3F" />
      <stop offset="100%" stop-color="#C70F30" />
    </linearGradient>

    <!-- Highlight for top/left bevel edges -->
    <linearGradient id="redHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA8BA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF385C" stop-opacity="0.1" />
    </linearGradient>

    <!-- Dark Shade for 3D bottom/right extrusion bevels -->
    <linearGradient id="redShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800618" />
      <stop offset="100%" stop-color="#4D020D" />
    </linearGradient>

    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF476B" />
      <stop offset="100%" stop-color="#B80E28" />
    </linearGradient>

    <!-- Soft Drop Shadow on Slate Canvas -->
    <filter id="emblemDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <!-- Subtle Bevel Inner Shadow -->
    <filter id="subtleBevel">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#FFFFFF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Sleek rounded slate squircle container -->
  <rect width="512" height="512" rx="108" fill="url(#slateGlow)" />
  <rect x="2" y="2" width="508" height="508" rx="106" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- The AdVerse 3D Red Emblem Group -->
  <g filter="url(#emblemDropShadow)" transform="translate(0, 0)">
    <!-- 3D Depth / Bevel Underlay (Offset downward for 3D extrusion) -->
    <g transform="translate(4, 9)" opacity="0.95">
      <!-- Steps 3D extrusion -->
      <polygon points="152,246 166,246 166,260 152,260" fill="url(#redShade)" />
      <polygon points="172,218 186,218 186,232 172,232" fill="url(#redShade)" />
      <polygon points="192,190 206,190 206,204 192,204" fill="url(#redShade)" />
      <polygon points="212,162 226,162 226,176 212,176" fill="url(#redShade)" />

      <!-- Main Apex & Arrow Body Extrusion -->
      <path d="M 240,78 
               L 276,140 
               L 316,196 
               L 340,148 
               L 362,88 
               L 364,188 
               L 332,236 
               L 332,284 
               L 294,228 
               L 240,168 
               L 186,228 
               L 154,284 
               L 138,260 
               Z" 
            fill="url(#redShade)" />
    </g>

    <!-- Main Front Surface of the Emblem -->
    <!-- 1. The 4 Ascending Pixel / Bar-Chart Steps on Left Flank -->
    <rect x="148" y="238" width="22" height="22" rx="2" fill="url(#stepGrad)" stroke="#FFA0B2" stroke-width="1.2" />
    <rect x="168" y="210" width="22" height="22" rx="2" fill="url(#stepGrad)" stroke="#FFA0B2" stroke-width="1.2" />
    <rect x="188" y="182" width="22" height="22" rx="2" fill="url(#stepGrad)" stroke="#FFA0B2" stroke-width="1.2" />
    <rect x="208" y="154" width="22" height="22" rx="2" fill="url(#stepGrad)" stroke="#FFA0B2" stroke-width="1.2" />

    <!-- 2. The Main "A" Peak and Right-Upward Arrow -->
    <path d="
      M 238,72
      L 312,188
      L 296,218
      L 242,164
      L 194,218
      L 156,270
      L 134,248
      L 194,152
      L 238,72
      Z"
      fill="url(#redFront)"
    />

    <!-- Chevron Bridge connecting to Right Arrow -->
    <path d="
      M 242,164
      L 296,218
      L 312,188
      L 326,146
      L 358,82
      L 358,180
      L 330,224
      L 330,270
      L 294,220
      L 242,164
      Z"
      fill="url(#redFront)"
    />

    <!-- Arrow Head on the Right Wing (Pointing Up-Right) -->
    <polygon points="358,74 366,176 334,142 308,172 322,130" fill="url(#redFront)" />
    <!-- Arrow right facet bevel -->
    <polygon points="358,74 366,176 348,154" fill="#C00C29" />

    <!-- Left Flank Bevel Facet -->
    <path d="M 238,72 L 244,78 L 202,156 L 194,152 Z" fill="#FF8CA3" opacity="0.75" />
    <path d="M 238,72 L 244,78 L 314,192 L 312,188 Z" fill="#B30924" opacity="0.9" />

    <!-- Inner Chevron Shadow Arch -->
    <polygon points="242,164 290,214 242,176 196,214" fill="#750516" opacity="0.9" />
  </g>
</svg>
