<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="advGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="advAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <filter id="advShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="14" fill="#0F172A" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Stylized "A" rocket / chevron icon for AdVerse Agency -->
  <path d="M32 9 L48 46 L38 46 L32 30 L26 46 L16 46 Z" fill="url(#advGrad)" filter="url(#advShadow)" />
  
  <!-- Inner Dynamic Arrow / Jet flame -->
  <polygon points="32,22 36,36 32,33 28,36" fill="#FFFFFF" opacity="0.95" />
  <polygon points="32,38 35,47 32,53 29,47" fill="url(#advAccent)" />
  
  <!-- Glowing Nodes -->
  <circle cx="32" cy="11" r="2.5" fill="#38BDF8" />
</svg>
